[package]
name = "iridium-units"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "A high-performance runtime unit-of-measure library for Rust"
keywords = ["units", "dimensional-analysis", "physics", "astronomy"]
categories = ["science", "mathematics"]
repository = "https://github.com/iridiumdesign/iridium-units"

[features]
default = ["cgs", "astrophysics", "logarithmic"]
cgs = []
astrophysics = []
logarithmic = []

[dependencies]
thiserror = "2.0"
lazy_static = "1.5"
once_cell = "1.20"

[dev-dependencies]
proptest = "1.5"
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "performance"
harness = false
